[project]
name = "langgraph-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.6.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "streamlit>=1.62.0",
]

[project.scripts]
langgraph-agent = "langgraph_agent.main:main"
[project.gui-scripts]
app = "langgraph_agent:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
